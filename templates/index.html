<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="../static/image.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAITRI AI Assistant</title>

    <style>
        body {
            font-family: Arial;
            background: #0b1c2d;
            color: white;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .box {
            background: #142b44;
            padding: 12px;
            border-radius: 10px;
            width: 340px;
        }

        .overall {
            background: #1d3b5f;
        }

        .response {
            background: #243f63;
            width: 650px;
        }

        textarea {
            width: 90%;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

<h1>MAITRI: AI Assistant for Astronaut WellBeing</h1>

<div class="container">

    <div class="box">
        <h2>Face Emotion</h2>
        <img src="{{ url_for('video') }}" width="280">
        <h3 id="faceEmotion">Detecting...</h3>
    </div>

    <div class="box">
        <h2>Audio Emotion</h2>
        <h3 id="audioEmotion">Detecting...</h3>
    </div>

    <div class="box">
        <h2>Text Emotion</h2>
        <textarea id="textInput" rows="4"
            placeholder="Type how you're feeling..."></textarea><br><br>
        <button onclick="detectText()">Analyze</button>
        <h3 id="textEmotion">None</h3>
    </div>

    <div class="box overall">
        <h2>OVERALL EMOTION</h2>
        <h1 id="overallEmotion">Detecting...</h1>
    </div>

    <div class="box response">
        <h2>AI Support Response</h2>
        <p id="aiResponse">Waiting for emotional analysis...</p>
    </div>

</div>

<script>

let isGenerating = false;

// 🔁 LIVE EMOTION UPDATE (NO LLM CALL)
setInterval(function(){

    if (isGenerating) return;

    fetch('/emotions')
    .then(res => res.json())
    .then(data => {
        document.getElementById("faceEmotion").innerHTML = data.face;
        document.getElementById("audioEmotion").innerHTML = data.audio;
        document.getElementById("overallEmotion").innerHTML = data.overall;
    });

}, 2000);


// 🔥 MAIN FUNCTION (FIXED)
function detectText(){

    if (isGenerating) return;

    const text = document.getElementById("textInput").value;

    if (text.trim() === "") return;

    isGenerating = true;

    document.getElementById("aiResponse").innerHTML = "Generating support response...";

    // STEP 1: TEXT EMOTION
    fetch('/text_emotion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("textEmotion").innerHTML =
            data.text_emotion || "None";

        // STEP 2: GENERATE RESPONSE (FIXED)
        return fetch('/generate_response', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },   // ✅ IMPORTANT
            body: JSON.stringify({ text: text })               // ✅ IMPORTANT
        });

    })
    .then(res => res.json())
    .then(result => {

        document.getElementById("aiResponse").innerHTML =
            result.response;

        isGenerating = false;

    })
    .catch(error => {
        console.error(error);
        document.getElementById("aiResponse").innerHTML =
            "AI system error.";
        isGenerating = false;
    });
}

</script>

</body>
</html>
