<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="../static/image.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAITRI AI Assistant</title>

    <style>
        body {
            font-family: Arial;
            background: #0b1c2d;
            color: white;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .box {
            background: #142b44;
            padding: 12px;
            border-radius: 10px;
            width: 340px;
        }

        .overall {
            background: #1d3b5f;
        }

        .response {
            background: #243f63;
            width: 650px;
        }

        textarea {
            width: 90%;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

<div style="display:flex; align-items:center; justify-content:center; gap:16px; margin: 24px auto 30px;">
    <img src="../static/astro.jpg"
         style="width:60px; height:60px; object-fit:cover; border-radius:50%; border:2px solid #4a90d9; box-shadow:0 0 14px rgba(74,144,217,0.5);">
    <h1 style="margin:0;">MAITRI: AI Assistant for Astronauts</h1>
</div>

<div class="container">

    <div class="box">
        <h2>Face Emotion</h2>
        <img src="{{ url_for('video') }}" width="280">
        <h3 id="faceEmotion">Detecting...</h3>
    </div>

    <div class="box">
        <h2>Audio Emotion</h2>
        <h3 id="audioEmotion">Detecting...</h3>
    </div>

    <div class="box">
        <h2>Text Emotion</h2>
        <textarea id="textInput" rows="4"
            placeholder="Type how you're feeling..."></textarea><br><br>
        <button onclick="detectText()">Analyze</button>
        <h3 id="textEmotion">None</h3>
    </div>

    <div class="box overall">
        <h2>OVERALL EMOTION</h2>
        <h1 id="overallEmotion">Detecting...</h1>
    </div>

    <div class="box response">
        <h2>AI Support Response</h2>
        <p id="aiResponse">Waiting for emotional analysis...</p>
    </div>

</div>

<script>



setInterval(function(){

    fetch('/emotions')
    .then(res => res.json())
    .then(data => {
        document.getElementById("faceEmotion").innerHTML = data.face;
        document.getElementById("audioEmotion").innerHTML =
    data.audio || "No audio detected";
        document.getElementById("overallEmotion").innerHTML = data.overall;
    });

}, 2000);


function detectText(){

    const text = document.getElementById("textInput").value;

    if (text.trim() === "") return;

    // 🔒 Disable button while processing
    const btn = document.querySelector("button");
    btn.disabled = true;

    document.getElementById("aiResponse").innerHTML = "Generating support response...";

    fetch('/text_emotion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("textEmotion").innerHTML =
            data.text_emotion || "None";

        return fetch('/generate_response', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });

    })
    .then(res => res.json())
    .then(result => {

        document.getElementById("aiResponse").innerHTML =
            result.response;

        // ✅ Re-enable button after completion
        btn.disabled = false;

    })
    .catch(error => {
        console.error(error);
        document.getElementById("aiResponse").innerHTML =
            "AI system error.";

        // ✅ Re-enable button even on error
        btn.disabled = false;
    });
}

</script>

</body>
</html>
